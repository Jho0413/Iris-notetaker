[project]
name = "iris"
version = "0.1.0"
description = "Iris: notes that see what was shown."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "openai>=1.50",
    "av>=12.0",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "markdown-it-py>=3",
    "mdformat>=0.7",
    "resvg-py>=0.5.0",
    "mcp>=2.3",
    "pysilero-vad>=3.4",
]

[project.scripts]
iris = "iris.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Only the headless OpenCV build may supply cv2. The full build (if a dependency pulls it in)
# overwrites the same files and needs system libGL/glib on Linux, breaking "no system deps".
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
