# Packaging for the desktop app (make desktop). Signed with a Developer ID Application certificate
# from the login keychain and notarized by Apple (scripts/build-app.sh passes the notarytool
# keychain profile), so a downloaded copy opens without Open Anyway. No certificate, no build.
appId: io.github.jho0413.iris
productName: Iris
directories:
  output: dist
  buildResources: build-resources
files:
  - main.cjs
  - package.json
  - src/**/*
  - pages/**/*
  - preload/**/*
  - assets/**/*
extraResources:
  # Standalone Python with Iris installed (scripts/build-backend.sh).
  - from: build/backend/python
    to: backend/python
  # The built UI (npm run build in frontend/), served over app://iris.
  - from: ../frontend/dist
    to: frontend
# Something running as the user must not be able to start Iris with its own code in it: that code
# would run as Iris, which the Keychain trusts with the OpenAI key without asking. So no
# ELECTRON_RUN_AS_NODE, NODE_OPTIONS or --inspect, and only the signed app.asar, checked against
# the hash in Info.plist, is loaded. Remote debugging has no fuse: main.cjs refuses it
# (src/debugging.cjs). electron-builder flips the fuses before it signs.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
electronLanguages: [en]
npmRebuild: false
forceCodeSigning: true
mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.productivity
  icon: build/icon.icns
  # scripts/build-app.sh refuses to build without a Developer ID Application certificate: given none,
  # electron-builder signs with any other identity it finds, such as an Apple Development one.
  notarize: true
  # The hardened runtime stops other programs attaching a debugger to Iris or injecting libraries
  # into it at launch (DYLD_INSERT_LIBRARIES), ways round the fuses to the key Iris holds. Library
  # validation stays on: Iris loads only libraries signed by its own team. The entitlements let back
  # in only what Iris needs: one file for the app, one for its helpers and the bundled Python.
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.inherit.plist
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: Iris records your voice, and what is on screen if you share it, to write your notes.
    NSAudioCaptureUsageDescription: Iris records the sound your Mac plays, such as a call or a video, to write your notes.
dmg:
  sign: false
